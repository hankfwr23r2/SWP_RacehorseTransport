<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản lý - Vận chuyển Ngựa</title>
    <link rel="stylesheet" href="manager_login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../global_translate.css">
</head>
<body>
    <div class="auth-layout">
        <!-- Left Side -->
        <div class="auth-left">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </div>
                Vận chuyển Ngựa
            </div>
            
            <div class="auth-content">
                <h1>Hệ thống Quản lý Vận hành</h1>
                <p>Nền tảng kiểm soát và điều phối toàn diện lộ trình vận chuyển ngựa đua an toàn, tiêu chuẩn.</p>
            </div>
            
            <div class="auth-footer">
                © 2026 EquineLogistics Manager Portal. Hệ thống nội bộ.
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-right">
            <div class="auth-form-container">
                <h2>Cổng Quản lý</h2>
                <p>Vui lòng đăng nhập với tài khoản cấp quản lý</p>
                
                <form action="manager_dashboard.html">
                    <div class="form-group">
                        <label for="email">Tên đăng nhập / Email</label>
                        <input type="text" id="email" placeholder="manager@equinelogistics.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                    
                    <button type="submit" class="btn-primary">Đăng nhập Quản lý</button>
                </form>
                
                <div class="return-link">
                    <a href="../index.html">← Quay lại Trang chủ</a>
                </div>
            </div>
        </div>
    </div>
<script src="../global_translate.js"></script>
</body>
</html>
