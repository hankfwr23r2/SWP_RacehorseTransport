<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Vận chuyển Ngựa</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../global_translate.css">
</head>
<body>
    <div class="auth-layout">
        <!-- Left Side -->
        <div class="auth-left">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                </div>
                Vận chuyển Ngựa
            </div>
            
            <div class="auth-content">
                <h1>Vận chuyển Ngựa đua Chuyên nghiệp</h1>
                <p>An toàn, chuẩn quốc tế và giám sát 24/7 trên mọi dặm đường của chiến mã.</p>
            </div>
            
            <div class="auth-footer">
                © 2026 EquineLogistics. Tiêu chuẩn vận tải hiệp hội hoàng gia.
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-right">
            <div class="auth-form-container" style="max-width: 450px;">
                <h2>Tạo Tài khoản</h2>
                <p>Đăng ký để trải nghiệm dịch vụ vận chuyển chuyên nghiệp</p>
                
                <form action="login.html">
                    <div class="form-group">
                        <label for="fullname">Họ và Tên</label>
                        <input type="text" id="fullname" placeholder="Nhập họ và tên" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" id="phone" placeholder="Nhập số điện thoại" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Nhập địa chỉ email" required>
                    </div>

                    <div class="form-group">
                        <label for="farm">Trang trại / Câu lạc bộ</label>
                        <input type="text" id="farm" placeholder="Tên tổ chức (Không bắt buộc)">
                    </div>

                    <div class="form-group">
                        <label for="otp">Mã xác thực OTP</label>
                        <div class="input-with-icon">
                            <input type="text" id="otp" placeholder="Nhập mã OTP" required>
                            <span class="icon">🔑</span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary" style="margin-top: 1rem;">Đăng Ký Ngay</button>
                </form>
                
                <div class="auth-switch" style="text-align: center;">
                    Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
<script src="../global_translate.js"></script>
</body>
</html>
