<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EquineZLogistics</title>

    <link rel="stylesheet" href="driver.css">
    <link rel="stylesheet" href="../global_translate.css">
</head>

<body>

    <div class="driver-page">

        <!-- HEADER -->

        <header class="topbar">

            <div class="topbar-logo">

                <div class="logo-box">
                    EQ
                </div>

                <span>EquineZLogistics</span>

            </div>

            <div class="driver-info">

                <span>Tài xế</span>

                <span>|</span>

                <button class="logout" id="logoutBtn">
                    Đăng xuất
                </button>

            </div>

        </header>


        <!-- MAIN -->

        <main class="main-content">

            <!-- VIEW TRIP -->

            <button class="menu-card" id="viewTripBtn">

                <div class="card-icon trip-icon">

                    <div class="map-line"></div>

                    <div class="map-pin">
                        ●
                    </div>

                </div>

                <div class="card-content">

                    <h1>
                        Xem Chuyến đi
                    </h1>

                    <p>
                        Chuyến xe được phân công hôm nay
                    </p>

                </div>

                <span class="arrow">
                    ›
                </span>

            </button>


            <!-- CHECKPOINTS -->

            <button class="menu-card" id="checkpointsBtn">

                <div class="card-icon checkpoint-icon">

                    <div class="location-pin">
                        <span></span>
                    </div>

                    <div class="location-ring"></div>

                </div>

                <div class="card-content">

                    <h1>
                        Điểm kiểm tra
                    </h1>

                    <p>
                        Cập nhật vị trí hiện tại của bạn
                    </p>

                </div>

                <span class="arrow">
                    ›
                </span>

            </button>

        </main>

    </div>


    <script src="driver.js"></script>

<script src="../global_translate.js"></script>
</body>

</html>
