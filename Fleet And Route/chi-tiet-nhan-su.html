<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440">
  <title>Chi tiết Phân công Nhân sự</title>
  <link rel="stylesheet" href="OPS-04.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="fleet_route_sidebar.css">

  <link rel="stylesheet" href="../global_translate.css">
</head>

<body>

  <div class="ops-layout">
    <aside class="ops-sidebar">
      <div class="ops-brand">
        <div class="logo-circle">EQ</div>
        <span>Điều hành</span>
      </div>
      <nav class="ops-nav">
        <a href="OPS-03.html" class="nav-item">
          Khả thi
        </a>

        <a href="OPS-05.html" class="nav-item">
          Lộ trình
        </a>

        <a href="OPS-08.html" class="nav-item active">
          Phân công
        </a>

        <a href="OPS-06.html" class="nav-item">
          Giám sát
        </a>

        <a href="OPS-04.html" class="nav-item">
          Sự cố
        </a>

        <a href="OPS-07.html" class="nav-item">
          Đội xe
        </a>
      </nav>
      <button class="ops-logout" onclick="window.location.href='../index.html'">Đăng xuất</button>
    </aside>
    <div class="ops-main">



      <div class="page active" id="page-staff-detail">
        <div class="breadcrumb-bar">
          <div class="dot"></div>
          <span>Đội xe Hub / Chi tiết Phân công Nhân sự</span>
        </div>
        <div class="workspace">
          <div class="page-title">Chi tiết Nhân sự</div>
          <div class="page-subtitle">Hồ sơ người đi theo chuyến (tài xế / hộ tống) và các chặng đang phụ trách.</div>

          <div class="card">
            <div class="card-title">
              <div class="icon"></div> <span id="staff-title"></span>
            </div>
            <div class="divider"></div>
            <div id="staff-info"></div>
          </div>

          <div class="card">
            <div class="card-title">Chặng đang phụ trách</div>
            <table>
              <thead>
                <tr>
                  <th>Chuyến</th>
                  <th>Tuyến</th>
                  <th>Chặng</th>
                  <th>Từ → Đến</th>
                  <th>Trạng thái chuyến</th>
                </tr>
              </thead>
              <tbody id="staff-trips"></tbody>
            </table>
            <div class="flex-end mt-16">
              <button class="btn btn-outline" onclick="window.location.href='OPS-08.html'">Về Phân công</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="ops_data.js"></script>
  <script src="staff-detail.js"></script>
  <script src="../global_translate.js"></script>
</body>

</html>
